[project]
name = "cvsearch"
version = "0.1.0"
description = "CV parsing, structuring and natural-language search for HR teams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "openai>=1.50",
    "azure-identity>=1.17",
    "tenacity>=9.0",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pillow>=10.4",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
local-embeddings = ["fastembed>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pgserver>=0.1.4",
    "types-psycopg2",
]

[project.scripts]
cvsearch = "cvsearch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs an embedded PostgreSQL (pgserver)", "live: calls the real LLM gateway"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
